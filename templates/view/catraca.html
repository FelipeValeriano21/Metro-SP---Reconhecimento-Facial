<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrô Fácil | Reconhecimento facial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --azul: #0d47a1;
            --azul-claro: #2196f3;
            --ok: #198754;
            --erro: #dc3545;
            --cor-estado: #ffffff;
        }
        body { background-color: #f1f5f9; font-family: Arial, sans-serif; min-height: 100vh; }
        .logo { color: var(--azul); font-size: 26px; font-weight: bold; }
        .logo span { color: var(--azul-claro); }
        .painel {
            max-width: 560px; width: 100%; background: #fff;
            border-radius: 16px; padding: 32px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, .08);
        }
        .btn-primary { background-color: var(--azul); border-color: var(--azul); }
        .btn-primary:hover, .btn-primary:focus { background-color: #083578; border-color: #083578; }
        .btn-outline-primary { color: var(--azul); border-color: var(--azul); }
        .btn-outline-primary:hover { background-color: var(--azul); border-color: var(--azul); }

        /* Visor da câmera */
        .visor {
            position: relative; aspect-ratio: 4 / 3; background: #0b1b33;
            border-radius: 12px; overflow: hidden;
        }
        .visor video, .visor canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1);
        }
        .visor canvas { display: none; }
        .visor.capturado canvas { display: block; }
        .visor.capturado video { display: none; }

        /* Moldura oval: guia onde posicionar o rosto */
        .guia {
            position: absolute; top: 50%; left: 50%;
            width: 46%; aspect-ratio: 3 / 4; transform: translate(-50%, -50%);
            border: 3px solid var(--cor-estado); border-radius: 50%;
            box-shadow: 0 0 0 100vmax rgba(8, 30, 70, .45);
            transition: border-color .2s;
        }
        .visor.lendo .guia { animation: pulsa 1.1s ease-in-out infinite; }
        @keyframes pulsa { 50% { border-color: var(--azul-claro); } }
        .visor.ok { --cor-estado: #4ade80; }
        .visor.falha { --cor-estado: #ff6b6b; }

        /* Linha de varredura, só enquanto lê */
        .varredura {
            position: absolute; left: 25%; right: 25%; top: 15%; height: 2px;
            background: var(--azul-claro); box-shadow: 0 0 10px var(--azul-claro);
            display: none;
        }
        .visor.lendo .varredura { display: block; animation: varre 1.4s ease-in-out infinite alternate; }
        @keyframes varre { to { top: 85%; } }

        .sem-camera {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            color: #b9c8e0; padding: 24px;
        }
        .visor.ativo .sem-camera { display: none; }
        .visor:not(.ativo) .guia { display: none; }

        .estado { min-height: 56px; }

        @media (prefers-reduced-motion: reduce) {
            .visor.lendo .guia, .visor.lendo .varredura { animation: none; }
        }
    </style>
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="painel">

        <div class="text-center mb-4">
            <div class="logo">Metrô <span>Fácil</span></div>
            <h1 class="h5 mt-3 mb-1">Bem-Vindo!</h1>
            <p class="text-muted mb-0">Olhe para a câmera para liberar seu acesso.</p>
        </div>

        <div id="visor" class="visor mb-3">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <div class="guia"></div>
            <div class="varredura"></div>
            <div class="sem-camera">
                <svg width="40" height="40" fill="currentColor" viewBox="0 0 16 16" class="mb-2" aria-hidden="true">
                    <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                    <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                </svg>
                <span>A câmera está desligada.</span>
            </div>
        </div>

        <div id="estado" class="estado text-center mb-3" role="status" aria-live="polite">
            <div class="text-muted">Ligue a câmera para começar.</div>
        </div>

        <div class="d-grid gap-2">
            <button id="btnCamera" class="btn btn-outline-primary py-2">Ligar câmera</button>
            <button id="btnReconhecer" class="btn btn-primary py-2" disabled>Reconhecer rosto</button>
            <button id="btnNovamente" class="btn btn-outline-primary py-2 d-none">Tentar novamente</button>
        </div>

        <div class="text-center mt-3">
            <a href="/menu" class="small text-decoration-none">Voltar ao menu</a>
        </div>

        <hr class="my-4">
        <div class="text-center text-muted" style="font-size:13px">
            Metrô Fácil © 2026<br>Projeto acadêmico cruzeiro do sul.
        </div>
    </div>
</div>

<script>
    const visor = document.getElementById("visor");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const estado = document.getElementById("estado");
    const btnCamera = document.getElementById("btnCamera");
    const btnReconhecer = document.getElementById("btnReconhecer");
    const btnNovamente = document.getElementById("btnNovamente");
    let stream = null;

    function mostrar(tipo, titulo, detalhe) {
        const cores = { info: "text-muted", ok: "text-success", erro: "text-danger" };
        estado.innerHTML =
            `<div class="fw-semibold ${cores[tipo]}">${titulo}</div>` +
            (detalhe ? `<div class="small text-muted">${detalhe}</div>` : "");
    }

    function limparEstadoVisor() {
        visor.classList.remove("lendo", "ok", "falha", "capturado");
    }

    async function ligarCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            video.srcObject = stream;
            visor.classList.add("ativo");
            btnReconhecer.disabled = false;
            btnCamera.textContent = "Desligar câmera";
            mostrar("info", "Posicione o rosto dentro da moldura.", "Procure um local bem iluminado.");
        } catch (e) {
            const negada = e.name === "NotAllowedError";
            mostrar("erro",
                negada ? "Permissão da câmera negada." : "Não foi possível abrir a câmera.",
                negada ? "Libere o acesso à câmera nas configurações do navegador."
                       : "Verifique se outro programa está usando a câmera.");
        }
    }

    function desligarCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        visor.classList.remove("ativo");
        limparEstadoVisor();
        btnReconhecer.disabled = true;
        btnNovamente.classList.add("d-none");
        btnReconhecer.classList.remove("d-none");
        btnCamera.textContent = "Ligar câmera";
        mostrar("info", "Ligue a câmera para começar.");
    }

    btnCamera.addEventListener("click", () => stream ? desligarCamera() : ligarCamera());

    btnReconhecer.addEventListener("click", async () => {
        // Captura o quadro atual (espelhado igual ao que a pessoa vê)
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        const imagem = canvas.toDataURL("image/jpeg", 0.9);

        visor.classList.add("capturado", "lendo");
        btnReconhecer.disabled = true;
        btnCamera.disabled = true;
        mostrar("info", "Reconhecendo…", "Mantenha o rosto parado.");

        try {
            const resposta = await fetch("/reconhecer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ imagem })
            });
            const resultado = await resposta.json();

            visor.classList.remove("lendo");

            if (!resposta.ok) throw new Error(resultado.erro || "Rosto não reconhecido.");

            visor.classList.add("ok");
            mostrar("ok", `Acesso liberado, ${resultado.nome || "passageiro"}.`,
                    resultado.mensagem || "");
            desligarCamera_semLimpar();
        } catch (erro) {
            visor.classList.remove("lendo");
            visor.classList.add("falha");
            mostrar("erro", erro.message || "Erro de conexão com o servidor.",
                    "Ajuste a iluminação e tente de novo.");
            btnReconhecer.classList.add("d-none");
            btnNovamente.classList.remove("d-none");
            btnCamera.disabled = false;
        }
    });

    // Mantém a foto e o resultado na tela, mas libera a câmera
    function desligarCamera_semLimpar() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = null;
        btnCamera.disabled = false;
        btnCamera.textContent = "Ligar câmera";
        btnReconhecer.classList.add("d-none");
        btnNovamente.classList.remove("d-none");
    }

    btnNovamente.addEventListener("click", async () => {
        limparEstadoVisor();
        btnNovamente.classList.add("d-none");
        btnReconhecer.classList.remove("d-none");
        if (!stream) await ligarCamera();
        btnReconhecer.disabled = !stream;
    });

    window.addEventListener("beforeunload", () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
    });
</script>
</body>
</html>
