<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrô Fácil | Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #0d47a1;
            font-size: 30px;
            font-weight: bold;
        }

        .logo span {
            color: #2196f3;
        }

        .btn-primary {
            background-color: #0d47a1;
            border-color: #0d47a1;
        }

        .btn-primary:hover {
            background-color: #083578;
        }

        .btn-outline-primary {
            color: #0d47a1;
            border-color: #0d47a1;
        }

        .btn-outline-primary:hover {
            background-color: #0d47a1;
        }

        .form-control {
            padding: 12px;
        }

        .footer-text {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">

        <div class="login-container">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="logo">Metrô <span>Fácil</span></div>
                <p class="text-muted mt-2">
                    A maneira inteligente de acessar o metrô.
                </p>
            </div>

            <!-- Formulário -->
            <form id="formCadastro">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input
                        type="text"
                        class="form-control"
                        id="email"
                        placeholder="Digite seu email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        placeholder="seu senha"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    Ingressar
                </button>

                <div class="text-center mb-1">
              
                </div>

                    <a href="/cadastro" class="btn btn-outline-primary w-100 py-2">
            Criar uma conta
            </a>

            </form>

            <hr class="my-4">

            <div class="text-center footer-text">
                Metrô Fácil © 2026
                <br>
                Projeto acadêmico cruzeiro do sul.
            </div>

        </div>

    </div>

    <script>
        document.getElementById("formCadastro").addEventListener("submit", async function(event) {
            event.preventDefault();

            // 1. Captura os valores dos campos do HTML
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            // 2. Validação simples no front-end
            if (!email || !senha) {
                alert("Preencha todos os campos.");
                return;
            }

            // 3. Monta o objeto com os dados para enviar ao Flask
            const dados = {
                email: email,
                senha: senha
            };

            try {
                // 4. Chamando a URL local correta do seu servidor Flask
                const resposta = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    window.location.href = "/menu"; 
                    return;
                }

                if (!resposta.ok) {
                    throw new Error(resultado.erro || "Erro ao realizar cadastro.");
                }

         

            } catch (erro) {
                console.error("Erro na requisição:", erro);
                alert(erro.message || "Erro de conexão com o servidor.");
            }
        });

        function iniciarAcesso() {
            window.location.href = "/menu";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
