<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrô Fácil | Meu perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: Arial, sans-serif; min-height: 100vh; }
        .painel { max-width: 450px; width: 100%; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 5px 25px rgba(0,0,0,.08); }
        .logo { color: #0d47a1; font-size: 26px; font-weight: bold; }
        .logo span { color: #2196f3; }
        .avatar { width: 72px; height: 72px; border-radius: 50%; background: #0d47a1; color: #fff;
                  display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; margin: 0 auto 12px; }
        .btn-primary { background-color: #0d47a1; border-color: #0d47a1; }
        .btn-primary:hover, .btn-primary:focus { background-color: #083578; border-color: #083578; }
        .btn-outline-primary { color: #0d47a1; border-color: #0d47a1; }
        .btn-outline-primary:hover { background-color: #0d47a1; border-color: #0d47a1; }
        .form-control { padding: 12px; }
        .form-control:read-only { background-color: #f8fafc; }
    </style>
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="painel">

        <div class="text-center mb-4">
            <div class="logo">Metrô <span>Fácil</span></div>
            <div class="avatar mt-3" id="avatar"></div>
            <h1 class="h5 mb-0">Meu perfil</h1>
        </div>

        <form id="formPerfil">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="nome"  Readonly required value="{{usuario.nome}}">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" readonly required value="{{usuario.email}}">
            </div>

            <!-- Só aparece no modo de edição -->
            <div id="blocoSenha" class="d-none">
                <hr>
                <p class="text-muted small mb-3">Para trocar a senha, preencha os dois campos. Deixe em branco para manter a atual.</p>

                <div class="mb-3">
                    <label for="senhaAtual" class="form-label">Senha atual</label>
                    <input type="password" class="form-control" id="senhaAtual" autocomplete="current-password" value="{{usuario.senha}}">
                </div>

                <div class="mb-3">
                    <label for="novaSenha" class="form-label">Nova senha</label>
                    <input type="password" class="form-control" id="novaSenha" minlength="8" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
                </div>
            </div>

            <div id="aviso" class="mb-3" role="status" aria-live="polite"></div>

            <button type="button" id="btnEditar" class="btn btn-outline-primary w-100 py-2 mb-2">Editar perfil</button>

            <div id="botoesEdicao" class="d-none">
                <button type="submit" id="btnSalvar" class="btn btn-primary w-100 py-2 mb-2">Salvar alterações</button>
                <button type="button" id="btnCancelar" class="btn btn-outline-primary w-100 py-2 mb-2">Cancelar</button>
            </div>

            <a href="/menu" class="btn btn-link w-100 text-decoration-none">Voltar ao menu</a>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("formPerfil");
    const nome = document.getElementById("nome");
    const email = document.getElementById("email");
    const senhaAtual = document.getElementById("senhaAtual");
    const novaSenha = document.getElementById("novaSenha");
    const aviso = document.getElementById("aviso");
    const btnEditar = document.getElementById("btnEditar");
    const botoesEdicao = document.getElementById("botoesEdicao");
    const blocoSenha = document.getElementById("blocoSenha");
    const btnSalvar = document.getElementById("btnSalvar");

    let original = { nome: nome.value, email: email.value };

    function mostrar(tipo, texto) {
        aviso.innerHTML = `<div class="alert alert-${tipo} py-2 mb-0">${texto}</div>`;
    }

    function modoEdicao(ligado) {
        nome.readOnly = !ligado;
        email.readOnly = !ligado;
        blocoSenha.classList.toggle("d-none", !ligado);
        botoesEdicao.classList.toggle("d-none", !ligado);
        btnEditar.classList.toggle("d-none", ligado);
        if (!ligado) { senhaAtual.value = ""; novaSenha.value = ""; }
        else nome.focus();
    }

    btnEditar.addEventListener("click", () => { aviso.innerHTML = ""; modoEdicao(true); });

    document.getElementById("btnCancelar").addEventListener("click", () => {
        nome.value = original.nome;
        email.value = original.email;
        aviso.innerHTML = "";
        modoEdicao(false);
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (novaSenha.value && !senhaAtual.value) {
            mostrar("danger", "Informe a senha atual para trocar a senha.");
            return;
        }
        if (novaSenha.value && novaSenha.value.length < 8) {
            mostrar("danger", "A nova senha deve ter pelo menos 8 caracteres.");
            return;
        }

        btnSalvar.disabled = true;
        btnSalvar.textContent = "Salvando…";
        aviso.innerHTML = "";

        try {
            const resposta = await fetch("/perfil/atualizar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome: nome.value.trim(),
                    email: email.value.trim(),
                    senha_atual: senhaAtual.value,
                    nova_senha: novaSenha.value
                })
            });
            const resultado = await resposta.json();

            if (!resposta.ok) throw new Error(resultado.erro || "Erro ao salvar.");

            original = { nome: nome.value.trim(), email: email.value.trim().toLowerCase() };
            nome.value = original.nome;
            email.value = original.email;
            document.getElementById("avatar").textContent = original.nome[0].toUpperCase();

            modoEdicao(false);
            mostrar("success", resultado.mensagem);
        } catch (erro) {
            mostrar("danger", erro.message || "Erro de conexão com o servidor.");
        } finally {
            btnSalvar.disabled = false;
            btnSalvar.textContent = "Salvar alterações";
        }
    });
</script>
</body>
</html>
